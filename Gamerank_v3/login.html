<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ingresá a tu cuenta de GameRank.">
  <title>Iniciar sesión · GameRank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600&display=optional" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-auth-page="login">
  <script src="js/app.js"></script>
  <main class="container auth-main">
    <section class="panel auth-panel" aria-labelledby="auth-title">
      <h1 id="auth-title">Iniciar sesión</h1>
      <p class="auth-intro">Volvé a descubrir tu próximo videojuego favorito.</p>
      <noscript><p class="field-error">Activá JavaScript para usar este formulario.</p></noscript>
      <form id="auth-form" method="post" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="username" maxlength="255" required aria-describedby="err-email" autocapitalize="none" spellcheck="false">
          <p class="field-error" id="err-email"></p>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required aria-describedby="err-password">
          <p class="field-error" id="err-password"></p>
        </div>
        <p class="auth-form-status" id="form-status" role="alert" tabindex="-1"></p>
        <button class="btn" type="submit">Ingresar</button>
      </form>
      <p class="auth-switch">¿Todavía no tenés cuenta? <a href="register.html">Creá tu cuenta</a>.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>GameRank · Descubrí, puntuá y reseñá videojuegos.</p>
      <a href="reviews.html#privacidad">Política de privacidad</a>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-form.js"></script>
</body>
</html>
